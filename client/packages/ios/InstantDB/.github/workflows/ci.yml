name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Swift ${{ matrix.swift }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "5.10", "6.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        run: echo "${{ matrix.swift }}" > .swift-version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"
      - name: Build
        run: swift build
