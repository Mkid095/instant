services:
  postgres:
    restart: unless-stopped
    image: ghcr.io/instantdb/postgresql:postgresql-17-pg-hint-plan
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_USER: ${POSTGRES_USER:-instant}
      POSTGRES_DB: ${POSTGRES_DB:-instant}
    volumes:
      - "backend-db:/var/lib/postgresql/data"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "shared_preload_libraries=pg_hint_plan"
      - "-c"
      - "random_page_cost=1.1"
    networks:
      - self-hosting_default

  www:
    env_file: .env
    networks:
      self-hosting_default:
        aliases:
          - www
    build:
      context: ..
      dockerfile: self-hosting/Dockerfile.www
      args:
        INSTANT_API_URI: ${INSTANT_API_URI}
        NEXT_PUBLIC_SELF_HOSTED: "true"
    depends_on:
      server:
        condition: service_started
    environment:
      - INSTANT_BACKEND_URL=${INSTANT_BACKEND_URL:-http://localhost:8888}
      - INSTANT_API_URI=${INSTANT_API_URI}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

  server:
    depends_on:
      postgres:
        condition: service_started
    image: ${INSTANT_SERVER_IMAGE:-ghcr.io/instantdb/server:custom}
    env_file: .env
    networks:
      self-hosting_default:
        aliases:
          - server
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      WAL_HISTORY_STORAGE: pg
      DATABASE_URL: "postgresql://${POSTGRES_USER:-instant}:${POSTGRES_PASSWORD:-pass}@postgres:5432/${POSTGRES_DB:-instant}?sslmode=disable"
      CONNECTION_POOL_SIZE: ${CONNECTION_POOL_SIZE:-20}
      INSTANT_BACKEND_URL: ${INSTANT_BACKEND_URL:-http://localhost:8888}
      INSTANT_DASHBOARD_URL: ${INSTANT_DASHBOARD_URL:-http://localhost:3000}
      INSTANT_DASH_HOST: ${INSTANT_DASH_HOST:-http://localhost:3000}
      INSTANT_MAVEN_HOST: ${INSTANT_MAVEN_HOST:-http://localhost:3000/maven}
      INSTANT_API_HOST: ${INSTANT_API_URI:-http://localhost:8888}
      INSTANT_SUPERUSER_EMAIL: ${INSTANT_SUPERUSER_EMAIL:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_ID:-}
      INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET: ${INSTANT_DASHBOARD_GOOGLE_OAUTH_CLIENT_SECRET:-}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      SENDGRID_TOKEN: ${SENDGRID_TOKEN:-}
      INSTANT_EMAIL_PROVIDER: ${INSTANT_EMAIL_PROVIDER:-}
      INSTANT_EMAIL_REPLY_TO: ${INSTANT_EMAIL_REPLY_TO:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_NAME: ${INSTANT_DASHBOARD_EMAIL_SENDER_NAME:-}
      INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL: ${INSTANT_DASHBOARD_EMAIL_SENDER_EMAIL:-}
      INSTANT_APP_EMAIL_SENDER_NAME: ${INSTANT_APP_EMAIL_SENDER_NAME:-}
      INSTANT_APP_EMAIL_SENDER_EMAIL: ${INSTANT_APP_EMAIL_SENDER_EMAIL:-}
      INSTANT_TEAM_EMAIL_SENDER_NAME: ${INSTANT_TEAM_EMAIL_SENDER_NAME:-}
      INSTANT_TEAM_EMAIL_SENDER_EMAIL: ${INSTANT_TEAM_EMAIL_SENDER_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-minio}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - server_config:/app/resources/config
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      www:
        condition: service_started
      server:
        condition: service_started
    env_file:
      - .env
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-localhost}
      BACKEND_DOMAIN: ${BACKEND_DOMAIN:-api.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - self-hosting_default

  maven-repository:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile.maven:/etc/caddy/Caddyfile:ro
      - maven-repo:/srv/maven
    networks:
      - self-hosting_default

volumes:
  backend-db:
  caddy_data:
  caddy_config:
  server_config:
  maven-repo:

networks:
  self-hosting_default:
